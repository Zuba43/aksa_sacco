<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}AKSA - Savings & Credit Cooperative{% endblock %}
    </title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#0d6efd" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      rel="manifest"
      href="{{ url_for('static', filename='manifest.json') }}"
    />

    <style>
      :root {
        --brand-primary: #0d6efd;
        --brand-dark: #0f172a;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #334155;
      }

      /* Hero styling */
      .hero-section {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #ffffff;
        padding: 80px 0 60px;
      }

      .hero-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
      }

      /* Feature Card Hover Effects */
      .feature-card {
        transition:
          transform 0.2s ease-in-out,
          box-shadow 0.2s ease-in-out;
        border-radius: 0.75rem;
      }

      .feature-card:hover {
        transform: translateY(-4px);
      }

      /* Icon Badges */
      .icon-box {
        width: 56px;
        height: 56px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
      }
    </style>

    {% block extra_head %}{% endblock %}
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm"
    >
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="{{ url_for('index') }}"
        >
          <i class="bi bi-bank2 text-primary fs-4"></i>
          <span>AKSA SACCO</span>
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
    
          <div class="d-flex align-items-center gap-2">
            <!-- PWA Install Button (Displays automatically when mobile install criteria is met) -->
            <button
              id="pwaInstallBtn"
              class="btn btn-outline-primary btn-sm d-none align-items-center gap-1 me-1"
            >
              <i class="bi bi-download"></i> Install App
            </button>
            <a
              href="{{ url_for('auth.login') if url_for is defined else '#' }}"
              class="btn btn-outline-light px-4"
              >Sign In</a
            >
            <a
              href="{{ url_for('auth.logout') if url_for is defined else '#' }}"
              class="btn btn-primary px-4"
              >Logout</a
            >
          </div>
        </div>
      </div>
    </nav>


    <main class="flex-grow-1">{% block content %}{% endblock %}</main>


    <footer
      class="bg-dark text-light py-4 mt-auto border-top border-secondary border-opacity-25"
    >
      <div class="container text-center text-md-start">
        <div class="row gy-3">
          <div class="col-md-6">
            <h5 class="fw-bold d-flex align-items-center gap-2">
              <i class="bi bi-bank2 text-primary"></i> AKSA Savings & Credit
            </h5>
            <p class="text-secondary small mb-0">
              Empowering financial growth, transparent credit management, and
              seamless group savings.
            </p>
          </div>
          <div class="col-md-6 text-md-end align-self-center">
            <small class="text-secondary"
              >&copy; 2026 AKSA. Built with Ibanda.</small
            >
          </div>
        </div>
      </div>
    </footer>

    <!-- Service Worker & PWA Installation Handler Script -->
    <script>
      // Service Worker Registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("{{ url_for('static', filename='sw.js') }}")
            .then((reg) =>
              console.log("Service Worker registered successfully:", reg.scope),
            )
            .catch((err) =>
              console.error("Service Worker registration failed:", err),
            );
        });
      }

      // PWA Prompt Handler for In-App "Install App" Button
      let deferredPrompt;
      const installBtn = document.getElementById("pwaInstallBtn");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) {
          installBtn.classList.remove("d-none");
          installBtn.classList.add("d-inline-flex");
        }
      });

      if (installBtn) {
        installBtn.addEventListener("click", async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === "accepted") {
            console.log("PWA install accepted by user");
          }
          deferredPrompt = null;
          installBtn.classList.add("d-none");
        });
      }

      window.addEventListener("appinstalled", () => {
        if (installBtn) installBtn.classList.add("d-none");
        console.log("AKSA PWA installed");
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
